<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasar Candi Gebang Permai - Lapak Warga</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0f172a;
            --accent: #d97706;
            --accent-hover: #b45309;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #334155;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
            color: #fff;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: #94a3b8;
            font-size: 1rem;
        }

        /* Developer Badge Style */
        .dev-badge-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 0.75rem;
        }

        .dev-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(251, 191, 36, 0.3);
            padding: 0.35rem 0.85rem;
            border-radius: 50px;
            font-size: 0.8rem;
            color: #e2e8f0;
            backdrop-filter: blur(5px);
        }

        .blinking-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: blink 1.5s infinite ease-in-out;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card h2 {
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.75rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 90px;
        }

        .btn-submit {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.85rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .products-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.25rem;
            max-height: 700px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .product-card {
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .product-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: #f1f5f9;
        }

        .product-body {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-category {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 0.25rem;
            letter-spacing: 0.5px;
        }

        .product-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .product-desc {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 1rem;
            flex-grow: 1;
            line-height: 1.4;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 0.75rem;
            margin-top: auto;
        }

        .product-price {
            font-size: 1rem;
            font-weight: 700;
            color: #059669;
        }

        .btn-wa {
            background: #25d366;
            color: white;
            border: none;
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: background 0.2s;
        }

        .btn-wa:hover {
            background: #22c55e;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: #64748b;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-store"></i> Pasar Candi Gebang Permai</h1>
            <p>Etalase Digital Warga: Praktis, Mewah, dan Langsung Pesan via WhatsApp</p>
            <div class="dev-badge-container">
                <div class="dev-badge">
                    <span class="blinking-dot"></span>
                    <span>developer : fatur62</span>
                </div>
            </div>
        </header>

        <div class="main-grid">
            <div class="card">
                <h2><i class="fa-solid fa-circle-plus"></i> Tambah Lapak Baru</h2>
                <form id="productForm">
                    <div class="form-group">
                        <label for="namaProduk">Nama Barang / Kuliner</label>
                        <input type="text" id="namaProduk" class="form-control" placeholder="Contoh: Telur Ayam Negeri 1 Kg" required>
                    </div>
                    <div class="form-group">
                        <label for="kategori">Kategori</label>
                        <select id="kategori" class="form-control" required>
                            <option value="Sembako & Bahan Pokok">Sembako & Bahan Pokok</option>
                            <option value="Kuliner / Masakan">Kuliner / Masakan</option>
                            <option value="Frozen Food">Frozen Food</option>
                            <option value="Fashion & Lainnya">Fashion & Lainnya</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="harga">Harga (Rp)</label>
                        <input type="number" id="harga" class="form-control" placeholder="Contoh: 28000" required min="0">
                    </div>
                    <div class="form-group">
                        <label for="gambar">Link Foto Barang (URL)</label>
                        <input type="url" id="gambar" class="form-control" placeholder="https://example.com/foto.jpg" required>
                    </div>
                    <div class="form-group">
                        <label for="noWa">Nomor WhatsApp Penjual</label>
                        <input type="tel" id="noWa" class="form-control" placeholder="Contoh: 628123456789" required>
                    </div>
                    <div class="form-group">
                        <label for="deskripsi">Deskripsi Singkat</label>
                        <textarea id="deskripsi" class="form-control" placeholder="Kondisi fresh, siap antar area perumahan..." required></textarea>
                    </div>
                    <button type="submit" class="btn-submit">
                        <i class="fa-solid fa-paper-plane"></i> Terbitkan ke Etalase
                    </button>
                </form>
            </div>

            <div class="card">
                <div class="products-header">
                    <h2><i class="fa-solid fa-boxes-stacked"></i> Etalase Lapak Warga</h2>
                </div>
                <div id="productsContainer" class="products-grid">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // Inisialisasi data awal (Mock Data) untuk demo
        const defaultProducts = [
            {
                id: 1,
                nama: "Telur Ayam Negeri Segar",
                kategori: "Sembako & Bahan Pokok",
                harga: 28000,
                gambar: "https://images.unsplash.com/photo-1582722872445-44dc5f7e3c8f?auto=format&fit=crop&w=500&q=80",
                noWa: "628123456789",
                deskripsi: "Kualitas super, bersih, langsung dari agen terpercaya Blok C."
            },
            {
                id: 2,
                nama: "Puding Lumut Vla Vanilla",
                kategori: "Kuliner / Masakan",
                harga: 15000,
                gambar: "https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=500&q=80",
                noWa: "628987654321",
                deskripsi: "Manis pas, segar, cocok untuk hidangan keluarga sore hari."
            }
        ];

        // Fungsi aman untuk mengambil data dari localStorage dengan error handling & validasi
        function getProducts() {
            try {
                const stored = localStorage.getItem('candi_gebang_lapak');
                if (!stored) return defaultProducts;
                const parsed = JSON.parse(stored);
                return Array.isArray(parsed) ? parsed : defaultProducts;
            } catch (error) {
                console.error("Gagal membaca data dari LocalStorage:", error);
                return defaultProducts;
            }
        }

        // Fungsi aman untuk menyimpan data ke localStorage
        function saveProducts(products) {
            try {
                localStorage.setItem('candi_gebang_lapak', JSON.stringify(products));
            } catch (error) {
                console.error("Gagal menyimpan data:", error);
            }
        }

        // Format angka ke format Rupiah
        function formatRupiah(number) {
            const num = Number(number);
            if (isNaN(num)) return "Rp 0";
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
        }

        // Render Produk ke DOM
        function renderProducts() {
            const container = document.getElementById('productsContainer');
            if (!container) return;

            const products = getProducts();
            container.innerHTML = '';

            if (products.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-basket-shopping"></i>
                        <p>Belum ada lapak yang dibuka. Yuk, tambahkan produk pertamamu!</p>
                    </div>
                `;
                return;
            }

            products.forEach(item => {
                // Validasi data null/undefined demi keamanan rendering
                const name = item.nama || "Tanpa Nama";
                const cat = item.kategori || "Lainnya";
                const price = formatRupiah(item.harga);
                const img = item.gambar || "https://via.placeholder.com/300x150?text=No+Image";
                const desc = item.deskripsi || "-";
                const wa = item.noWa || "#";
                
                // Format pesan otomatis ke WhatsApp penjual
                const waMessage = encodeURIComponent(`Halo, saya tertarik dengan produk *${name}* (${price}) yang ada di Etalase Candi Gebang Permai. Apakah masih tersedia?`);
                const waLink = `https://wa.me/${wa}?text=${waMessage}`;

                const cardEl = document.createElement('div');
                cardEl.className = 'product-card';
                cardEl.innerHTML = `
                    <img src="${img}" alt="${name}" class="product-img" onerror="this.src='https://via.placeholder.com/300x150?text=Gagal+Muat+Gambar'">
                    <div class="product-body">
                        <span class="product-category">${cat}</span>
                        <h3 class="product-title">${name}</h3>
                        <p class="product-desc">${desc}</p>
                        <div class="product-footer">
                            <span class="product-price">${price}</span>
                            <a href="${waLink}" target="_blank" class="btn-wa">
                                <i class="fa-brands fa-whatsapp"></i> Beli
                            </a>
                        </div>
                    </div>
                `;
                container.appendChild(cardEl);
            });
        }

        // Event Listener Form Submit
        const productForm = document.getElementById('productForm');
        if (productForm) {
            productForm.addEventListener('submit', function(e) {
                e.preventDefault();

                // Ambil nilai input secara aman
                const nama = document.getElementById('namaProduk').value.trim();
                const kategori = document.getElementById('kategori').value;
                const harga = Number(document.getElementById('harga').value);
                const gambar = document.getElementById('gambar').value.trim();
                const noWa = document.getElementById('noWa').value.trim();
                const deskripsi = document.getElementById('deskripsi').value.trim();

                // Validasi dasar
                if (!nama || isNaN(harga) || !gambar || !noWa) {
                    alert("Mohon lengkapi formulir dengan benar!");
                    return;
                }

                const newProduct = {
                    id: Date.now(),
                    nama,
                    kategori,
                    harga,
                    gambar,
                    noWa,
                    deskripsi
                };

                const products = getProducts();
                products.unshift(newProduct); // Tambah di urutan paling atas
                saveProducts(products);

                // Reset form & perbarui tampilan
                productForm.reset();
                renderProducts();
            });
        }

        // Jalankan render saat halaman pertama kali dimuat
        document.addEventListener('DOMContentLoaded', renderProducts);
    </script>
</body>
</html>
