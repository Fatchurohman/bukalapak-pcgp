<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerbang Pasar Digital - Candi Gebang Permai</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0f172a;
            --accent: #d97706;
            --accent-hover: #b45309;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #334155;
            --radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .container { width: 100%; max-width: 550px; }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        .icon-header { font-size: 3rem; color: var(--accent); margin-bottom: 1rem; }
        h1 { font-size: 1.8rem; font-weight: 700; color: var(--primary); margin-bottom: 0.5rem; }
        p { color: #64748b; font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.5; }
        
        .btn-group { display: flex; flex-direction: column; gap: 1rem; }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .btn-buyer { background: var(--accent); color: white; }
        .btn-buyer:hover { background: var(--accent-hover); transform: translateY(-2px); }
        .btn-seller { background: #ffffff; color: var(--primary); border: 2px solid #cbd5e1; }
        .btn-seller:hover { background: #f8fafc; border-color: var(--primary); transform: translateY(-2px); }

        .dev-badge-container { display: flex; justify-content: center; align-items: center; margin-top: 2rem; }
        .dev-badge {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: rgba(15, 23, 42, 0.05);
            border: 1px solid rgba(217, 119, 6, 0.2);
            padding: 0.35rem 0.85rem; border-radius: 50px;
            font-size: 0.8rem; color: #475569;
        }
        .blinking-dot {
            width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%;
            box-shadow: 0 0 8px #22c55e; animation: blink 1.5s infinite ease-in-out;
        }
        @keyframes blink { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="icon-header"><i class="fa-solid fa-store"></i></div>
            <h1>Pasar Candi Gebang Permai</h1>
            <p>Pusat Etalase Digital Warga. Silakan pilih menu akses di bawah ini sesuai kebutuhan Anda.</p>

            <div class="btn-group">
                <a href="buyer.html" class="nav-btn btn-buyer">
                    <i class="fa-solid fa-basket-shopping"></i> Halaman Utama (Pembeli)
                </a>
                <a href="admin.html" class="nav-btn btn-seller">
                    <i class="fa-solid fa-circle-plus"></i> Halaman Penjual (Kelola Lapak)
                </a>
            </div>

            <div class="dev-badge-container">
                <div class="dev-badge">
                    <span class="blinking-dot"></span>
                    <span>developer : fatur62</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
