<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Lapak Penjual - Pasar Candi Gebang Permai</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary: #0f172a;
            --accent: #d97706;
            --accent-hover: #b45309;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-main: #334155;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        .header-nav {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.6rem 1.2rem; border-radius: 50px; text-decoration: none; font-size: 0.9rem;
            display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.3s ease;
        }
        .btn-back:hover { background: rgba(255, 255, 255, 0.2); }

        .card {
            background: var(--card-bg); border-radius: var(--radius); padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); margin-bottom: 2.5rem;
        }

        h2 { font-size: 1.4rem; color: var(--primary); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group.full-width { grid-column: 1 / -1; }

        label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 0.4rem; color: #475569; }
        input, select, textarea {
            width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 10px;
            font-size: 0.95rem; outline: none; transition: all 0.2s; background: #f8fafc;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(217,119,6,0.15); }

        .btn-submit {
            background: var(--accent); color: white; border: none; padding: 0.85rem 1.5rem;
            border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; width: 100%;
            transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 0.5rem;
        }
        .btn-submit:hover { background: var(--accent-hover); }
        .btn-cancel {
            background: #64748b; color: white; border: none; padding: 0.85rem 1.5rem;
            border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; display: none; margin-top: 0.5rem; width: 100%;
        }

        /* Tabel Produk */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.85rem 1rem; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; }
        th { background: #f1f5f9; color: #475569; font-weight: 700; }
        .img-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; }

        .btn-act { padding: 0.4rem 0.75rem; border-radius: 6px; border: none; font-size: 0.8rem; font-weight: 600; cursor: pointer; margin-right: 0.25rem; }
        .btn-edit { background: #3b82f6; color: white; }
        .btn-delete { background: #ef4444; color: white; }

        .dev-badge { text-align: center; color: #cbd5e1; font-size: 0.8rem; margin-top: 2rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-nav">
            <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Beranda Utama</a>
            <h1 style="color: #fff; font-size: 1.5rem;"><i class="fa-solid fa-store" style="color: #fbbf24;"></i> Panel Penjual</h1>
        </div>

        <!-- Form Tambah / Edit Produk -->
        <div class="card">
            <h2 id="formTitle"><i class="fa-solid fa-square-plus" style="color: var(--accent);"></i> Tambah Produk Baru</h2>
            <form id="productForm">
                <input type="hidden" id="editProductId" value="">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="namaToko">Nama Toko / Pemilik</label>
                        <input type="text" id="namaToko" placeholder="Contoh: Bu Siti Sembako" required>
                    </div>
                    <div class="form-group">
                        <label for="noWa">Nomor WhatsApp</label>
                        <input type="tel" id="noWa" placeholder="08123456789" required>
                    </div>
                    <div class="form-group">
                        <label for="nama">Nama Produk / Makanan</label>
                        <input type="text" id="nama" placeholder="Contoh: Beras C4 Premium 5kg" required>
                    </div>
                    <div class="form-group">
                        <label for="harga">Harga (Rp)</label>
                        <input type="number" id="harga" placeholder="65000" required>
                    </div>
                    <div class="form-group">
                        <label for="kategori">Kategori Produk</label>
                        <select id="kategori" required>
                            <option value="Sembako & Bahan Pokok">Sembako & Bahan Pokok</option>
                            <option value="Kuliner / Masakan">Kuliner / Masakan</option>
                            <option value="Frozen Food">Frozen Food</option>
                            <option value="Fashion & Lainnya">Fashion & Lainnya</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="varian">Varian (Opsional, Pisahkan Koma)</label>
                        <input type="text" id="varian" placeholder="Contoh: Pedas, Manis, Original">
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="gambar">URL Gambar Produk</label>
                    <input type="url" id="gambar" placeholder="https://domain.com/foto.jpg" required>
                </div>

                <div class="form-group full-width">
                    <label for="deskripsi">Deskripsi Singkat</label>
                    <textarea id="deskripsi" rows="3" placeholder="Tuliskan keterangan produk, porsi, atau promo..." required></textarea>
                </div>

                <button type="submit" class="btn-submit" id="btnSave"><i class="fa-solid fa-paper-plane"></i> Tayangkan Produk</button>
                <button type="button" class="btn-cancel" id="btnCancel" onclick="resetForm()">Batal Edit</button>
            </form>
        </div>

        <!-- Tabel Daftar Produk Penjual -->
        <div class="card">
            <h2><i class="fa-solid fa-list-check" style="color: var(--accent);"></i> Daftar Produk Terpasang</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Produk</th>
                            <th>Toko</th>
                            <th>Harga</th>
                            <th>Kategori</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="sellerProductTable">
                        <tr><td colspan="6" style="text-align: center;">Memuat data produk...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="dev-badge">developer : fatur62</div>
    </div>

    <script src="config.js"></script>
    <script>
        const productForm = document.getElementById('productForm');
        const sellerProductTable = document.getElementById('sellerProductTable');

        function loadSellerProducts() {
            if (!db) return;

            db.collection('products').onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    sellerProductTable.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #94a3b8;">Belum ada produk yang ditayangkan.</td></tr>`;
                    return;
                }

                let html = '';
                snapshot.docs.forEach((doc) => {
                    const item = doc.data();
                    const img = item.gambar || 'https://via.placeholder.com/50';
                    const price = 'Rp ' + Number(item.harga || 0).toLocaleString('id-ID');

                    html += `
                        <tr>
                            <td><img src="${img}" class="img-thumb" alt="${item.nama}"></td>
                            <td><strong>${item.nama || '-'}</strong></td>
                            <td>${item.namaToko || '-'}</td>
                            <td>${price}</td>
                            <td><span style="font-size:0.75rem; background:#f1f5f9; padding:0.2rem 0.5rem; border-radius:4px;">${item.kategori || 'Lainnya'}</span></td>
                            <td>
                                <button class="btn-act btn-edit" onclick="editProduct('${doc.id}', '${escapeHtml(item.namaToko)}', '${escapeHtml(item.noWa)}', '${escapeHtml(item.nama)}', '${item.harga}', '${item.kategori}', '${escapeHtml(item.gambar)}', '${escapeHtml(item.deskripsi)}', '${escapeHtml(item.varian || '')}')"><i class="fa-solid fa-pen"></i></button>
                                <button class="btn-act btn-delete" onclick="deleteProduct('${doc.id}')"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
                sellerProductTable.innerHTML = html;
            }, (error) => {
                console.error("Gagal memuat produk penjual:", error);
                sellerProductTable.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #ef4444;">Gagal memuat data.</td></tr>`;
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!db) {
                alert("Database belum terhubung!");
                return;
            }

            const productId = document.getElementById('editProductId').value;
            const payload = {
                namaToko: document.getElementById('namaToko').value.trim(),
                noWa: document.getElementById('noWa').value.trim(),
                nama: document.getElementById('nama').value.trim(),
                harga: Number(document.getElementById('harga').value) || 0,
                kategori: document.getElementById('kategori').value,
                varian: document.getElementById('varian').value.trim(),
                gambar: document.getElementById('gambar').value.trim(),
                deskripsi: document.getElementById('deskripsi').value.trim()
            };

            try {
                if (productId) {
                    await db.collection('products').doc(productId).update(payload);
                    alert("Produk berhasil diperbarui!");
                } else {
                    payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection('products').add(payload);
                    alert("Produk berhasil ditayangkan!");
                }
                resetForm();
            } catch (err) {
                console.error("Gagal menyimpan data:", err);
                alert("Terjadi kesalahan: " + err.message);
            }
        });

        function editProduct(id, namaToko, noWa, nama, harga, kategori, gambar, deskripsi, varian) {
            document.getElementById('editProductId').value = id;
            document.getElementById('namaToko').value = namaToko;
            document.getElementById('noWa').value = noWa;
            document.getElementById('nama').value = nama;
            document.getElementById('harga').value = harga;
            document.getElementById('kategori').value = kategori;
            document.getElementById('gambar').value = gambar;
            document.getElementById('deskripsi').value = deskripsi;
            document.getElementById('varian').value = varian;

            document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-pen-to-square" style="color: var(--accent);"></i> Edit Produk`;
            document.getElementById('btnSave').innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Simpan Perubahan`;
            document.getElementById('btnCancel').style.display = 'block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteProduct(id) {
            if (!confirm("Apakah Anda yakin ingin menghapus produk ini?")) return;
            try {
                await db.collection('products').doc(id).delete();
                alert("Produk berhasil dihapus!");
            } catch (err) {
                console.error("Gagal menghapus produk:", err);
                alert("Gagal menghapus produk!");
            }
        }

        function resetForm() {
            document.getElementById('editProductId').value = '';
            productForm.reset();
            document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-square-plus" style="color: var(--accent);"></i> Tambah Produk Baru`;
            document.getElementById('btnSave').innerHTML = `<i class="fa-solid fa-paper-plane"></i> Tayangkan Produk`;
            document.getElementById('btnCancel').style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', loadSellerProducts);
    </script>
</body>
</html>
